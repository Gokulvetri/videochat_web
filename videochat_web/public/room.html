<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Chat Room</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .gradient-bg {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }
    .glass-effect {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .video-container {
      position: relative;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
    }
    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body class="gradient-bg text-white min-h-screen flex flex-col">

  <header class="glass-effect p-4 flex justify-between items-center">
    <div class="flex items-center space-x-4">
      <i class="fas fa-video text-blue-400 text-xl"></i>
      <h1 class="text-xl font-bold">Room: <span id="roomName" class="text-blue-400">Loading...</span></h1>
    </div>
    <div class="flex items-center space-x-4">
      <div id="connectionStatus" class="text-yellow-400 font-semibold flex items-center">
        <i class="fas fa-circle text-xs mr-2"></i>
        <span>Connecting...</span>
      </div>
      <a href="index.html" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-semibold flex items-center space-x-2">
        <i class="fas fa-sign-out-alt"></i>
        <span>Leave Room</span>
      </a>
    </div>
  </header>

  <main class="flex-grow p-6">
    <div class="max-w-7xl mx-auto">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Remote Video -->
        <div class="glass-effect rounded-xl overflow-hidden">
          <div class="video-container">
            <video id="remoteVideo" autoplay playsinline class="w-full h-full"></video>
          </div>
          <div class="p-4">
            <h3 class="font-semibold">Remote Participant</h3>
            <p class="text-sm text-gray-400" id="remoteStatus">Waiting for connection...</p>
          </div>
        </div>

        <!-- Local Video -->
        <div class="glass-effect rounded-xl overflow-hidden">
          <div class="video-container">
            <video id="localVideo" autoplay muted playsinline class="w-full h-full"></video>
          </div>
          <div class="p-4">
            <h3 class="font-semibold">You</h3>
            <p class="text-sm text-gray-400" id="localStatus">Connected</p>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="glass-effect rounded-xl p-4 mt-6 flex justify-center space-x-4">
        <button id="muteButton" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg font-semibold flex items-center space-x-2">
          <i class="fas fa-microphone"></i>
          <span>Mute</span>
        </button>
        <button id="videoToggleButton" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg font-semibold flex items-center space-x-2">
          <i class="fas fa-video"></i>
          <span>Turn Off Video</span>
        </button>
        <button id="endCallButton" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-semibold flex items-center space-x-2">
          <i class="fas fa-phone-slash"></i>
          <span>End Call</span>
        </button>
      </div>

      <!-- Room Info -->
      <div class="glass-effect rounded-xl p-4 mt-6 text-center">
        <h3 class="font-semibold mb-2">Room Information</h3>
        <p class="text-sm text-gray-400">Share this room name with others to join your call</p>
        <div class="mt-2 flex justify-center items-center space-x-2">
          <span id="roomNameDisplay" class="font-mono bg-gray-800 px-3 py-1 rounded"></span>
          <button onclick="copyRoomName()" class="text-blue-400 hover:text-blue-300">
            <i class="fas fa-copy"></i>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const roomName = params.get('room') || 'Unknown';
    document.getElementById('roomName').textContent = roomName;
    document.getElementById('roomNameDisplay').textContent = roomName;

    function copyRoomName() {
      navigator.clipboard.writeText(roomName).then(() => {
        const copyButton = document.querySelector('button[onclick="copyRoomName()"]');
        copyButton.innerHTML = '<i class="fas fa-check"></i>';
        setTimeout(() => {
          copyButton.innerHTML = '<i class="fas fa-copy"></i>';
        }, 2000);
      });
    }
  </script>
  <script src="js/signaling.js"></script>
  <script src="js/room.js"></script>
</body>
</html>
